[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plugin-beta"
version = "0.1.0"
description = "Example plugin Beta for entry_points_plugins"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["entry-points-plugins"]

[project.entry-points."entry_points_plugins.plugins"]
beta = "plugin_beta:BetaPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_beta"]
