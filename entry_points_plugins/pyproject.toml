[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entry-points-plugins"
version = "0.1.0"
description = "Example Python plugin system that discovers plugins via importlib.metadata entry_points"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=7",
    # Install the bundled example plugins in editable mode for testing
    "plugin-alpha",
    "plugin-beta",
]

[tool.hatch.build.targets.wheel]
packages = ["src/entry_points_plugins"]
