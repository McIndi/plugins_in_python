[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "singleton-registry"
version = "0.1.0"
description = "Example Python plugin system using a singleton registry and classmethod registration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/singleton_registry"]
